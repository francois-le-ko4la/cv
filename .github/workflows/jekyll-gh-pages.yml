# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Build the PDF from the rendered page
        # Chrome is preinstalled on GitHub-hosted Ubuntu runners; the page's print stylesheet sets the A4 layout.
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 --print-to-pdf=/tmp/cv.pdf "file://$PWD/_site/index.html"
          test "$(stat -c %s /tmp/cv.pdf)" -gt 20000
          sudo cp /tmp/cv.pdf "_site/$(sed -nE 's/^pdf_name: *//p' _config.yml)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
