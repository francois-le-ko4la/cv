name: Lint Markdown

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: "**/*.md"
