<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.min.css">
  <style>
    :root {
      --nav-bg: rgba(255, 255, 255, .72);
      --nav-bg-scrolled: rgba(255, 255, 255, .9);
      --nav-border: rgba(208, 215, 222, .7);
      --nav-text: #57606a;
      --nav-accent: #0969da;
      --nav-pill: rgba(9, 105, 218, .1);
      --page-bg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --nav-bg: rgba(13, 17, 23, .72);
        --nav-bg-scrolled: rgba(13, 17, 23, .9);
        --nav-border: rgba(48, 54, 61, .8);
        --nav-text: #8b949e;
        --nav-accent: #58a6ff;
        --nav-pill: rgba(56, 139, 253, .15);
        --page-bg: #0d1117;
      }
    }
    html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
    body { margin: 0; background: var(--page-bg); }

    header.bar {
      position: sticky; top: 0; z-index: 10;
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(8px);
      -webkit-backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--nav-border);
      transition: background .3s ease, box-shadow .3s ease;
    }
    header.bar.scrolled {
      background: var(--nav-bg-scrolled);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
    }
    nav.toc {
      position: relative;
      display: flex; gap: .25rem; justify-content: center;
      overflow-x: auto; scrollbar-width: none; white-space: nowrap;
      max-width: 1012px; margin: 0 auto; padding: .55rem 1rem;
      font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    nav.toc::-webkit-scrollbar { display: none; }
    nav.toc a {
      position: relative; z-index: 1;
      color: var(--nav-text); text-decoration: none;
      padding: .35rem .8rem; border-radius: 999px;
      transition: color .2s ease;
    }
    nav.toc a:hover, nav.toc a.active { color: var(--nav-accent); }
    nav.toc .pill {
      position: absolute; z-index: 0; top: .55rem; left: 0; height: calc(100% - 1.1rem);
      border-radius: 999px; background: var(--nav-pill);
      opacity: 0;
      transition: transform .35s cubic-bezier(.4, 0, .2, 1), width .35s cubic-bezier(.4, 0, .2, 1), opacity .2s ease;
    }
    .progress {
      position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%;
      background: var(--nav-accent);
      transform-origin: 0 50%; transform: scaleX(0);
    }
    @media (max-width: 900px) { nav.toc { justify-content: flex-start; } }
    /* No backdrop blur on phones: it is recomputed on every scrolled frame. */
    @media (max-width: 767px) {
      header.bar, header.bar.scrolled { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--nav-bg-scrolled); }
    }

    .markdown-body { box-sizing: border-box; max-width: 1012px; margin: 0 auto; padding: 32px 45px; }
    @media (max-width: 767px) { .markdown-body { padding: 15px; } }


    /* Header card */
    .hero { display: flex; align-items: center; gap: 1.5rem; margin: .5rem 0 2rem; }
    .hero img.avatar {
      width: 96px; height: 96px; border-radius: 50%; flex: none; background: var(--page-bg);
      box-shadow: 0 0 0 3px var(--page-bg), 0 0 0 5px var(--nav-accent), 0 6px 18px rgba(0, 0, 0, .15);
    }
    .hero h1 { margin: 0; padding: 0; border: 0; font-size: 2rem; }
    .hero .role { margin: .2rem 0 .6rem; color: var(--nav-text); font-size: 1.1rem; }
    .hero .links { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; }
    .hero .links a {
      font-size: 13px; padding: .25rem .75rem; border-radius: 999px; text-decoration: none;
      border: 1px solid var(--nav-border); color: var(--nav-text); transition: all .2s ease;
    }
    .hero .links a:hover { color: var(--nav-accent); border-color: var(--nav-accent); background: var(--nav-pill); }
    @media (max-width: 600px) { .hero { flex-direction: column; text-align: center; } .hero .links { justify-content: center; } }

    /* Skill tags */
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      font-size: 12.5px; line-height: 1.6; padding: 0 .55rem; border-radius: 999px;
      background: var(--nav-pill); color: var(--nav-accent); white-space: nowrap;
    }
    .markdown-body table td:first-child { white-space: nowrap; font-weight: 600; }

    /* Timeline */
    .timeline { position: relative; margin-left: .5rem; padding-left: 1.75rem; border-left: 2px solid var(--nav-border); }
    .tl-item { padding-bottom: .5rem; }
    /* Dot drawn on the job title: vertically centered on it, horizontally centered on the 2px line. */
    .tl-item > h3 { position: relative; }
    .tl-item > h3::before {
      content: ""; position: absolute; box-sizing: border-box;
      width: 14px; height: 14px; border-radius: 50%;
      left: calc(-1.75rem - 8px); top: 50%; transform: translateY(-50%);
      background: var(--page-bg); border: 2px solid var(--nav-text);
    }
    .tl-item.current > h3::before { background: var(--nav-accent); border-color: var(--nav-accent); box-shadow: 0 0 0 4px var(--nav-pill); }

    /* Footer */
    footer.updated { max-width: 1012px; margin: 0 auto; padding: 0 45px 32px; color: var(--nav-text);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      header.bar, nav.toc a, nav.toc .pill, .hero .links a { transition: none; }
    }

    /* Print / PDF: light colors, compact A4 layout, no page-only controls */
    @page { size: A4; margin: 12mm 12mm 14mm; }
    @media print {
      :root { --page-bg: #fff; --nav-text: #57606a; --nav-accent: #0969da; --nav-pill: rgba(9, 105, 218, .1); --nav-border: #d0d7de; }
      body { background: #fff; }
      header.bar, .hero .links a.pdf { display: none; }
      .markdown-body { max-width: none; padding: 0; font-size: 11.5px; color: #1f2328; background: #fff; }
      .hero { margin: 0 0 1rem; }
      .hero img.avatar { width: 72px; height: 72px; box-shadow: none; border: 2px solid var(--nav-accent); box-sizing: border-box; }
      /* github-markdown-css makes tables scrollable blocks; paper cannot scroll, so fit them to the page */
      .markdown-body table { display: table; width: 100%; max-width: 100%; table-layout: fixed; }
      .markdown-body table td:first-child, .markdown-body table th:first-child { width: 22%; white-space: normal; }
      .markdown-body h2 { break-after: avoid; margin-top: 1.2em; }
      .markdown-body h3 { break-after: avoid; }
      .markdown-body tr, .markdown-body li, .hero { break-inside: avoid; }
      .tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .timeline { margin-left: 0; padding-left: 0; border-left: 0; }
      .tl-item > h3::before { display: none; }
      footer.updated { padding: 1rem 0 0; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <nav class="toc" aria-label="Sections"><span class="pill" aria-hidden="true"></span></nav>
    <div class="progress" aria-hidden="true"></div>
  </header>
  <main class="markdown-body">
    {{ content }}
  </main>
  <footer class="updated">Last updated: {{ site.time | date: '%B %-d, %Y' }}</footer>
  <script>

    // --- Page structure (README unchanged) ---------------------------------
    const body = document.querySelector('.markdown-body');
    const firstH2 = body.querySelector('h2');
    // Header card: everything before the first "##" (avatar, name, role).
    const intro = [];
    for (let n = body.firstChild; n && n !== firstH2; n = n.nextSibling) intro.push(n);
    const avatar = intro.map((n) => n.querySelector?.('img') || (n.tagName === 'IMG' ? n : null)).find(Boolean);
    const h1 = intro.find((n) => n.tagName === 'H1');
    const role = intro.find((n) => n.tagName === 'P' && !n.querySelector('img') && n.textContent.trim());
    if (h1) {
      const hero = document.createElement('section');
      hero.className = 'hero';
      if (avatar) { avatar.classList.add('avatar'); avatar.alt = h1.textContent.trim(); hero.append(avatar); }
      const card = document.createElement('div');
      card.append(h1);
      if (role) { role.className = 'role'; card.append(role); }
      const links = document.createElement('p');
      links.className = 'links';
      for (const [text, href] of [['LinkedIn', '{{ site.linkedin }}'], ['GitHub', 'https://github.com/{{ site.github_user }}']]) {
        if (!href || href.endsWith('/')) continue;
        const a = document.createElement('a');
        a.href = href; a.textContent = text; a.target = '_blank'; a.rel = 'noopener';
        links.append(a);
      }
      // PDF generated by the Pages workflow at each push (see .github/workflows/jekyll-gh-pages.yml).
      const pdf = document.createElement('a');
      pdf.href = '{{ site.pdf_name }}'; pdf.textContent = 'Download PDF'; pdf.className = 'pdf'; pdf.download = '';
      links.append(pdf);
      card.append(links);
      hero.append(card);
      intro.filter((n) => n !== h1 && n !== role).forEach((n) => n.remove());
      body.prepend(hero);
    }
    // One <section> per "##" (used to build the timeline).
    for (const h2 of [...body.querySelectorAll('h2')]) {
      const section = document.createElement('section');
      h2.before(section);
      let n = h2;
      while (n && !(n !== h2 && n.tagName === 'H2')) { const next = n.nextSibling; section.append(n); n = next; }
    }
    // Skill tags: second column of the tables, split on top-level commas only ("Azure (IaaS, M365)" stays one tag).
    const splitTop = (text) => {
      const out = []; let depth = 0, cur = '';
      for (const ch of text) {
        if (ch === '(') depth++;
        if (ch === ')') depth--;
        if ((ch === ',' || ch === ';') && depth === 0) { out.push(cur.trim()); cur = ''; } else cur += ch;
      }
      return [...out, cur.trim()].filter(Boolean);
    };
    for (const td of body.querySelectorAll('table td:nth-child(2)')) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      for (const t of splitTop(td.textContent)) {
        const span = document.createElement('span');
        span.className = 'tag'; span.textContent = t;
        tags.append(span);
      }
      td.replaceChildren(tags);
    }
    // Timeline: each "###" of the experience section and what follows it.
    const exp = [...body.querySelectorAll('section > h2')].find((h) => /experience/i.test(h.textContent) && !/prior/i.test(h.textContent));
    if (exp) {
      const timeline = document.createElement('div');
      timeline.className = 'timeline';
      let item = null;
      for (const n of [...exp.parentElement.childNodes].slice(1)) {
        if (n.tagName === 'H3') { item = document.createElement('div'); item.className = 'tl-item'; timeline.append(item); }
        if (item) item.append(n);
      }
      timeline.querySelector('.tl-item')?.classList.add('current');
      exp.after(timeline);
    }

    // Menu built from the README "##" headings: a new section shows up without editing this file.
    const bar = document.querySelector('header.bar');
    const nav = document.querySelector('nav.toc');
    const pill = nav.querySelector('.pill');
    const progress = document.querySelector('.progress');
    const label = (h) => {
      const text = h.textContent.replace(/[^\p{L}\p{N}/ ]/gu, '').trim();
      const short = text.includes('/') ? text.split('/').pop().trim() : text;
      return short.charAt(0) + short.slice(1).toLowerCase();
    };
    const headings = [...document.querySelectorAll('.markdown-body h2[id]')];
    const links = new Map();
    for (const h of headings) {
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = label(h);
      nav.append(a);
      links.set(h.id, a);
    }

    // Sliding pill under the active section; the menu scrolls to keep it visible on small screens.
    let active = null;
    const movePill = (a) => {
      if (!a) { pill.style.opacity = 0; return; }
      pill.style.width = a.offsetWidth + 'px';
      pill.style.transform = `translateX(${a.offsetLeft}px)`;
      pill.style.opacity = 1;
    };
    const setActive = (id) => {
      const a = links.get(id);
      if (!a || a === active) return;
      active?.classList.remove('active');
      a.classList.add('active');
      active = a;
      movePill(a);
      // Scroll only the menu, never the page (scrollIntoView breaks touch scrolling momentum).
      nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
    };
    const observer = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) setActive(e.target.id);
    }, { rootMargin: '-10% 0px -80% 0px' });
    headings.forEach((h) => observer.observe(h));
    addEventListener('resize', () => movePill(active));

    // Reading progress and raised bar once the page scrolls.
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      progress.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
      bar.classList.toggle('scrolled', scrollY > 8);
    };
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
